<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-slate-100 text-slate-800 font-sans">

    <header class="bg-gray-800 text-white shadow-md">
        <div class=" mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">LabPraktik SMK</h1>
            </div>
        </div>
    </header>

    <main class=" mx-auto px-6 py-8 space-y-8">

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

            <section class="md:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-400">
                <h2 class="text-lg font-semibold border-b pb-3 mb-4 text-slate-600">Form Peminjaman Alat</h2>

                <form id="formPinjam" class="space-y-4">
                    <input type="hidden" id="id_peminjaman">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nama Peminjam</label>
                        <input type="text" id="nama_peminjam" required 
                            class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Kelas</label>
                        <input type="text" id="kelas" required 
                            class="w-full px-3 py-2 border border-slate-700 rounded-lg  text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Pilih Alat Praktik</label>
                        <select id="id_alat" required
                            class="w-full px-3 py-2 border border-slate-700 rounded-lg  text-sm bg-white">
                            <option value="">-- Memuat data alat... --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Jumlah Pinjam</label>
                        <input type="number" id="jumlah" min="1" value="1" required
                            class="w-full px-3 py-2 border border-slate-700 rounded-lg  text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Tgl Pinjam</label>
                            <input type="date" id="tanggal_pinjam" required
                                class="w-full px-3 py-2 border border-slate-700 rounded-lg  text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Tgl Kembali</label>
                            <input type="date" id="tanggal_kembali" required
                                class="w-full px-3 py-2 border border-slate-700 rounded-lg  text-sm">
                        </div>
                    </div>

                    <div id="containerStatus" style="display: none;">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Status Peminjaman</label>
                        <select id="status"
                            class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm bg-white">
                            <option value="Dipinjam">Dipinjam</option>
                            <option value="Dikembalikan">Dikembalikan</option>
                            <option value="Terlambat">Terlambat</option>
                        </select>
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" id="btnSubmit"
                            class="flex-1 bg-blue-600 hover:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-lg transition duration-150 text-sm shadow-sm">
                            Proses Peminjaman
                        </button>
                        <button type="button" id="btnBatal" onclick="batalUbah()" style="display: none;"
                            class="bg-slate-500 hover:bg-slate-600 text-white font-medium py-2.5 px-4 rounded-lg transition duration-150 text-sm shadow-sm">
                            Batal
                        </button>
                    </div>
                </form>
            </section>

            <section class="md:col-span-7 bg-white p-6 rounded-xl shadow-sm border border-slate-400">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h2 class="text-lg font-semibold text-slate-700">Ketersediaan Alat Praktik</h2>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600">
                                <th class="py-2.5 px-3">ID</th>
                                <th class="py-2.5 px-3">Nama Alat</th>
                                <th class="py-2.5 px-3">Kategori</th>
                                <th class="py-2.5 px-3">Kondisi</th>
                                <th class="py-2.5 px-3">Lokasi</th>
                                <th class="py-2.5 px-3 text-center">Stok Tersedia</th>
                                <th class="py-2.5 px-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelAlat" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="7" class="py-4 text-center text-slate-400">Belum ada data alat</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-400">
            <h2 class="text-lg font-semibold border-b pb-3 mb-4 text-slate-700">Riwayat Peminjaman & Pengembalian
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600">
                            <th class="py-2.5 px-3">Peminjam</th>
                            <th class="py-2.5 px-3">Nama Alat</th>
                            <th class="py-2.5 px-3">Jumlah</th>
                            <th class="py-2.5 px-3">Tanggal Pinjam</th>
                            <th class="py-2.5 px-3">Tanggal kembali</th>
                            <th class="py-2.5 px-3">Status</th>
                            <th class="py-2.5 px-3 text-center">Aksi</th>

                        </tr>
                    </thead>
                    <tbody id="tabelRiwayat" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="7" class="py-4 text-center text-slate-400">Belum ada riwayat peminjaman
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>


    <div id="modalEditAlat" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-400 w-96 space-y-4">
            <h3 class="text-lg font-semibold text-slate-700 border-b pb-2">Edit Data Alat</h3>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Nama Alat</label>
                <input type="text" id="edit_nama_alat" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Kondisi</label>
                <input type="text" id="edit_kondisi_alat" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Stok</label>
                <input type="number" id="edit_stok_alat" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Lokasi</label>
                <input type="text" id="edit_lokasi_alat" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="tutupModalAlat()" class="px-4 py-2 bg-slate-300 text-slate-700 rounded-lg text-sm hover:bg-slate-400">Batal</button>
                <button type="button" onclick="simpanUbahAlat()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Simpan</button>
            </div>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>

</html>
